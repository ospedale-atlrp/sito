<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Staff Ospedaliero — Policlinico Nazionale Montessori</title>
<link rel="stylesheet" href="../css/style.css" />
<script>(function(){var t=localStorage.getItem('pm_theme')||'light';document.documentElement.setAttribute('data-theme',t);})();</script>
</head>
<body>

<div class="page-top-spacer"></div>

<section>
  <div class="container">
    <div class="section-head reveal">
      <span class="eyebrow">Atlantis RP — Server Minecraft</span>
      <h2 data-i18n="sections.staff.title">La nostra direzione</h2>
      <p data-i18n="sections.staff.subtitle">La gerarchia ufficiale del Policlinico.</p>
    </div>

    <div class="leadership-panel reveal" id="board" style="scroll-margin-top:100px;">
      <div class="leadership-tiers">

        <div class="leadership-tier-label">Direzione generale</div>
        <div class="leadership-tier" data-level="1" id="tier-dirigente"></div>

        <div class="leadership-tier-label">Chirurgia — Primari</div>
        <div class="leadership-tier" data-level="2" id="tier-primario"></div>

      </div>
    </div>

    <div id="istruttori" style="scroll-margin-top:100px;"></div>
    <div class="pyramid reveal" id="pyramid" style="display:none;"></div>
  </div>
</section>

<footer>
  <div class="container footer-inner">
    <span class="footer-text" data-i18n="footer.text">Policlinico Nazionale Montessori — Atlantis RP.</span>
    <div class="footer-copy">© OspedaleAtlantis - Tutti i contenuti sono gestiti da copyright per fini illustrativi e lavorativi</div>
  </div>
</footer>

<script src="../js/api.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-config.js"></script>
<script src="../js/supabase-client.js"></script>
<script src="../js/i18n.js"></script>
<script src="../js/hierarchy.js"></script>
<script src="../js/main.js"></script>
<script src="../js/staff.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/site-menu.js"></script>
<script>
  // La direzione (Dirigente e Chirurgo Primario) è collegata agli account veri:
  // chi viene promosso a uno di questi ruoli in dashboard compare qui in automatico.
  var PM_KNOWN_PHOTOS = {
    "SadObama_": "SadObama_.png",
    "lionelMMU": "Alexis Dialo.png",
    "Lunaticooh": "Luke Skywalker.png"
  };

  function pmInitials(name, username) {
    var src = (name || username || "??").trim();
    var parts = src.split(/\s+/).slice(0, 2);
    return parts.map(function (w) { return w.charAt(0); }).join("").toUpperCase();
  }

  function pmLeaderCardHtml(person, role) {
    var displayName = person.name || person.username;
    var photoFile = PM_KNOWN_PHOTOS[person.username] || (person.username + ".png");
    var imgPath = "../img/" + encodeURIComponent(photoFile);
    return '<div class="leader-card">' +
      '<span class="leader-role">' + role + '</span>' +
      '<div class="leader-avatar">' +
        '<img src="' + imgPath + '" alt="' + displayName + ' — ' + role + '" onerror="this.parentElement.classList.add(\'no-photo\'); this.remove();" />' +
        '<span class="leader-avatar-fallback">' + pmInitials(person.name, person.username) + '</span>' +
      '</div>' +
      '<span class="leader-name">' + displayName + '</span>' +
      '<span class="leader-nick">' + person.username + '</span>' +
    '</div>';
  }

  function pmRenderDirectionStaff() {
    var accounts = typeof pmLoadAccounts === "function" ? pmLoadAccounts() : {};
    var dirigenti = [], primari = [];
    Object.keys(accounts).forEach(function (uname) {
      var acc = accounts[uname];
      if (!acc.active) return;
      var person = { username: uname, name: acc.name };
      if (acc.role === "Dirigente") dirigenti.push(person);
      if (acc.role === "Chirurgo Primario") primari.push(person);
    });

    var tierDirigente = document.getElementById("tier-dirigente");
    var tierPrimari = document.getElementById("tier-primario");
    if (tierDirigente) {
      tierDirigente.innerHTML = dirigenti.map(function (p) { return pmLeaderCardHtml(p, "Dirigente"); }).join("")
        || '<p class="form-note">Nessun account con ruolo Dirigente al momento.</p>';
    }
    if (tierPrimari) {
      tierPrimari.innerHTML = primari.map(function (p) { return pmLeaderCardHtml(p, "Chirurgo Primario"); }).join("")
        || '<p class="form-note">Nessun account con ruolo Chirurgo Primario al momento.</p>';
    }
  }

  document.addEventListener("DOMContentLoaded", pmRenderDirectionStaff);
</script>
<script src="../js/staff-supabase.js"></script>
</body>
</html>
