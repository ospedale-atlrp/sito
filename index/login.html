<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Accesso — Policlinico Nazionale Montessori</title>
<link rel="stylesheet" href="../css/style.css" />
<script>(function(){var t=localStorage.getItem('pm_theme')||'light';document.documentElement.setAttribute('data-theme',t);})();</script>
</head>
<body>

<div class="auth-shell">
  <div class="auth-card">

    <div id="step-login">
      <img src="../img/logo_ospedale.png" alt="Logo Policlinico Nazionale Montessori" class="brand-mark" />
      <h1>Accesso</h1>
      <p class="auth-subtitle">Accedi con il tuo account Telegram. Nessuna password da ricordare.</p>

      <div class="form-error" id="login-error"></div>
      <div id="telegram-login-loading" class="form-note" style="display:none; margin-top:14px;">Accesso in corso...</div>

      <!-- Il bottone vero e proprio viene generato da Telegram in questo contenitore. -->
      <div id="telegram-login-widget" style="margin-top:22px; display:flex; justify-content:center;"></div>

      <p class="form-note" style="margin-top:18px;">
        Non hai Telegram o non riesci ad accedere? Scrivi al bot
        <a href="https://t.me/OspSito_bot" target="_blank" rel="noopener">@OspSito_bot</a>
        per assistenza.
      </p>

      <p class="form-note" style="margin-top:10px;"><a href="../index.html">Torna al sito pubblico</a></p>
    </div>

  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-config.js"></script>
<script src="../js/supabase-client.js"></script>
<script src="../js/i18n.js"></script>
<script src="../js/main.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/site-menu.js"></script>

<script>
  var PM_TELEGRAM_BOT_USERNAME = "OspSito_bot";

  // Protezione anti doppio-invio: se il widget Telegram richiama la funzione
  // più di una volta (doppio click, ricaricamento del bottone, ecc.), ogni
  // nuovo "biglietto" di accesso genererebbe l'invalidazione di quello
  // precedente lato Supabase, causando l'errore "Token has expired or is
  // invalid" anche se il primo tentativo era valido. Con questo blocco
  // accettiamo solo la PRIMA chiamata, finché non finisce (o fallisce).
  var pmLoginInFlight = false;

  function pmShowLoginError(text) {
    var el = document.getElementById('login-error');
    if (el) { el.textContent = text; el.classList.add('show'); }
  }

  // Chiamata da Telegram stesso quando la persona conferma l'accesso nel widget.
  async function pmTelegramAuth(telegramUser) {
    if (pmLoginInFlight) return; // ignora chiamate duplicate
    pmLoginInFlight = true;

    var loading = document.getElementById('telegram-login-loading');
    if (loading) loading.style.display = 'block';
    try {
      var res = await PM_DB.functions.invoke('telegram-auth', { body: telegramUser });
      var data = res.data, error = res.error;
      var serverMessage = null;
      if (error && error.context && typeof error.context.json === 'function') {
        try { var body = await error.context.json(); serverMessage = body && body.error; } catch (_) {}
      }
      if (error || !data || data.error) {
        throw new Error(serverMessage || (data && data.error) || 'Accesso Telegram non riuscito.');
      }

      var verify = await PM_DB.auth.verifyOtp({ email: data.email, token: data.tokenHash, type: 'magiclink' });
      if (verify.error) throw verify.error;

      window.location.href = 'dashboard.html';
    } catch (e) {
      if (loading) loading.style.display = 'none';
      pmShowLoginError(e.message || 'Accesso Telegram non riuscito. Riprova.');
      pmLoginInFlight = false; // permette un nuovo tentativo dopo un errore
    }
  }

  // Genera il bottone ufficiale di Telegram nel contenitore.
  document.addEventListener('DOMContentLoaded', function () {
    var container = document.getElementById('telegram-login-widget');
    if (!container) return;
    // Evita di generare il bottone due volte se questo script per qualche
    // motivo venisse eseguito più di una volta sulla stessa pagina.
    if (container.dataset.wired) return;
    container.dataset.wired = '1';

    var script = document.createElement('script');
    script.src = 'https://telegram.org/js/telegram-widget.js?22';
    script.async = true;
    script.setAttribute('data-telegram-login', PM_TELEGRAM_BOT_USERNAME);
    script.setAttribute('data-size', 'large');
    script.setAttribute('data-radius', '12');
    script.setAttribute('data-request-access', 'write');
    script.setAttribute('data-onauth', 'pmTelegramAuth(user)');
    container.appendChild(script);
  });
</script>
</body>
</html>
