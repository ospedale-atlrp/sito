<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Accesso — Policlinico Nazionale Montessori</title>
<link rel="stylesheet" href="../css/style.css" />
<script>(function(){var t=localStorage.getItem('pm_theme')||'light';document.documentElement.setAttribute('data-theme',t);})();</script>
</head>
<body>

<div class="auth-shell">
  <div class="auth-card">

    <div id="step-login">
      <img src="../img/logo_ospedale.png" alt="Logo Policlinico Nazionale Montessori" class="brand-mark" />
      <h1 data-i18n="login.title">Accesso Area Riservata</h1>
      <p class="auth-subtitle" data-i18n="login.subtitle">Riservato al personale del Policlinico.</p>

      <div class="form-error" id="login-error"></div>

      <form id="login-form">
        <div class="field">
          <label for="username" data-i18n="login.username">Nome utente</label>
          <input type="text" id="username" name="username" required autocomplete="username" placeholder="es. SadObama_" />
        </div>
        <div class="field">
          <label for="password" data-i18n="login.password">Password</label>
          <input type="password" id="password" name="password" required autocomplete="current-password" />
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;" data-i18n="login.submit">Accedi</button>
      </form>

      <p class="form-note" style="margin-top:18px;"><a href="index.html" data-i18n="login.back">Torna al sito pubblico</a></p>
    </div>

    <div id="step-firstaccess" style="display:none;">
      <img src="../img/logo_ospedale.png" alt="Logo Policlinico Nazionale Montessori" class="brand-mark" />
      <h1 data-i18n="login.firstAccess.title">Primo accesso</h1>
      <p class="auth-subtitle" data-i18n="login.firstAccess.text">Devi impostare una password personale.</p>

      <div class="form-error" id="firstaccess-error"></div>

      <form id="firstaccess-form">
        <div class="field">
          <label for="new-password">Nuova Password</label>
          <input type="password" id="new-password" name="newPassword" required autocomplete="new-password" />
        </div>
        <div class="field">
          <label for="new-password-confirm">Conferma Nuova Password</label>
          <input type="password" id="new-password-confirm" name="newPasswordConfirm" required autocomplete="new-password" />
        </div>
        <button type="submit" class="btn btn-primary" style="width:100%;">Imposta password e accedi</button>
      </form>
    </div>

  </div>
</div>

<script src="../js/api.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script src="../js/supabase-config.js"></script>
<script src="../js/supabase-client.js"></script>
<script src="../js/i18n.js"></script>
<script src="../js/main.js"></script>
<script src="../js/auth.js"></script>
<script src="../js/site-menu.js"></script>
</body>
</html>
